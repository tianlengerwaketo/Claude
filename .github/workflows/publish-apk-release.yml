name: Publish APK to Release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Workflow run ID that produced the app-debug.apk artifact"
        required: true
      artifact_name:
        description: "Artifact name to fetch"
        required: false
        default: gente-cerca-debug-apk

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: dist

      - name: Create release with APK asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="apk-run-${{ inputs.run_id }}"
          gh release create "$tag" \
            dist/*.apk \
            --repo "${{ github.repository }}" \
            --title "Gente Cerca APK" \
            --notes "APK built from workflow run ${{ inputs.run_id }}." \
            --target "${{ github.sha }}"
